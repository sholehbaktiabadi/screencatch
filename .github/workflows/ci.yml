name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  test-and-package:
    # Ubuntu 24.04 ships the oldest GTK (4.14) and libadwaita (1.5) we support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts lintian meson \
            python3 python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-pango-1.0 \
            desktop-file-utils appstream libglib2.0-bin

      - name: Unit tests and data validation
        run: make test

      - name: Meson build and test
        run: |
          meson setup _build/ci --prefix=/usr
          meson test -C _build/ci --print-errorlogs
          DESTDIR="$PWD/_build/stage" meson install -C _build/ci

      - name: Build .deb
        run: make deb

      - name: Lintian
        run: lintian --fail-on error,warning --info dist/*.deb

      - name: Install and smoke test
        run: |
          sudo apt-get install -y ./dist/*.deb
          screencatch --version
          screencatch --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: screencatch-deb
          path: dist/*.deb
          if-no-files-found: error
