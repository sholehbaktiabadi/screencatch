<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8ff2"/>
      <stop offset="1" stop-color="#2553a6"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="100">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7e1ef"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none"
        stroke="#000000" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Capture frame corners -->
  <g fill="none" stroke="#0b2752" stroke-opacity="0.4" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 42 V24 H42"/>
    <path d="M86 24 H104 V42"/>
    <path d="M24 86 V104 H42"/>
    <path d="M86 104 H104 V86"/>
  </g>

  <!-- Annotation: a circle around the subject and an arrow pointing at it -->
  <g stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="76" cy="49" rx="20" ry="14" fill="none" stroke-width="7"/>
    <path d="M39 93 L50 81" fill="none" stroke-width="8"/>
    <path d="M60 70 L56.6 90 L40.4 75 Z" fill="url(#mark)" stroke-width="4"/>
  </g>
</svg>
